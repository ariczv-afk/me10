<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Me Too Ten / גם אני עשר</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #dcfce7, #86efac);
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      overflow-x: hidden;
    }

    body.mobile-mode {
      align-items: flex-start;
      padding: 6px;
    }

    .game {
      width: min(1120px, 100%);
      background: #ffffffee;
      border-radius: 22px;
      box-shadow: 0 14px 36px rgba(0,0,0,.16);
      padding: 14px;
    }

    header { text-align: center; margin-bottom: 6px; position: relative; }
    h1 { margin: 0; font-size: 32px; color: #166534; }
    .subtitle { margin-top: 3px; color: #475569; font-size: 15px; }

    .language-toggle {
      position: absolute;
      top: 0;
      inset-inline-end: 0;
      display: flex;
      gap: 6px;
      background: #ecfdf5;
      border: 2px solid #bbf7d0;
      border-radius: 999px;
      padding: 4px;
    }

    .language-toggle button {
      box-shadow: none;
      padding: 7px 10px;
      font-size: 14px;
      border-radius: 999px;
      background: transparent;
      color: #166534;
    }

    .language-toggle button.active {
      background: #16a34a;
      color: white;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 7px;
      font-weight: bold;
      font-size: 15px;
    }

    .score-pill {
      background: #e0f2fe;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr 165px;
      gap: 12px;
      align-items: stretch;
      margin-top: 10px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 430px;
    }

    .player-box {
      background: linear-gradient(180deg, #f8fafc, #ecfdf5);
      border: 2px solid #bbf7d0;
      border-radius: 20px;
      padding: 12px;
      min-height: 185px;
      flex: 1;
    }

    .player-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 20px;
      font-weight: bold;
      color: #14532d;
      margin-bottom: 8px;
    }

    .sum {
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 16px;
      white-space: nowrap;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 110px;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 62px;
      height: 86px;
      background: white;
      border-radius: 12px;
      border: 3px solid #16a34a;
      box-shadow: 0 6px 10px rgba(0,0,0,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
      color: #166534;
      position: relative;
    }

    .card::before, .card::after {
      content: "♦";
      position: absolute;
      font-size: 16px;
      color: #ef4444;
    }
    .card::before { top: 6px; inset-inline-start: 7px; }
    .card::after { bottom: 6px; inset-inline-end: 7px; }

    .back {
      background: repeating-linear-gradient(45deg, #16a34a, #16a34a 8px, #22c55e 8px, #22c55e 16px);
      color: transparent;
      border-color: #14532d;
    }
    .back::before, .back::after { content: "?"; color: white; }

    .action-box {
      background: #fffdf0;
      border: 2px solid #fde68a;
      border-radius: 18px;
      padding: 10px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .message {
      min-height: 64px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #854d0e;
      line-height: 1.35;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .controls .new { grid-column: 1 / -1; }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,.25);
    }

    button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .hit { background: #2563eb; }
    .stand { background: #f97316; }
    .new { background: #16a34a; }

    .meter-panel {
      background: #ffffffee;
      border: 3px solid #16a34a;
      border-radius: 20px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 430px;
    }

    .meter-panel h2 { margin: 0 0 6px; color: #166534; font-size: 18px; }
    .meter-sum { font-size: 15px; font-weight: bold; color: #334155; margin-bottom: 8px; }

    .meter-wrap {
      position: relative;
      width: 72px;
      height: 270px;
      margin: 0 auto;
      overflow: visible;
    }

    .overflow-zone {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 0;
      height: 70px;
      border: 3px dashed #ef4444;
      border-bottom: none;
      border-radius: 14px 14px 0 0;
      background: #fff1f2;
      overflow: hidden;
    }

    .ten-tank {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 200px;
      border: 5px solid #14532d;
      border-radius: 0 0 16px 16px;
      background: repeating-linear-gradient(to top, #fff 0, #fff 17px, #dbeafe 17px, #dbeafe 20px);
      overflow: hidden;
    }

    .ten-fill, .overflow-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      transition: height .25s ease;
    }
    .ten-fill { background: #22c55e; }
    .overflow-fill { background: #ef4444; }

    .ten-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 70px;
      height: 7px;
      background: #111827;
      border-radius: 999px;
      z-index: 5;
    }

    .label10 { position: absolute; inset-inline-end: 78px; top: 60px; font-weight: bold; color: #111827; }
    .label0 { position: absolute; inset-inline-end: 78px; bottom: 0; font-weight: bold; color: #334155; }

    .overflow-box {
      margin-top: 8px;
      min-height: 24px;
      color: #dc2626;
      font-weight: bold;
      font-size: 15px;
    }

    .stats-box, .wish-box {
      margin-top: 8px;
      border-radius: 14px;
      padding: 8px;
      font-weight: bold;
      line-height: 1.35;
      font-size: 14px;
      width: 100%;
    }

    .stats-box {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      color: #1e3a8a;
    }

    .wish-box {
      background: #fef9c3;
      border: 2px solid #fde047;
      color: #854d0e;
    }

    .rules {
      margin-top: 10px;
      background: #f8fafc;
      border-radius: 14px;
      padding: 9px 12px;
      color: #475569;
      line-height: 1.4;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      body { align-items: flex-start; padding: 6px; }
      .game { padding: 10px; border-radius: 16px; }
      header { padding-top: 42px; }
      .language-toggle { left: 50%; right: auto; transform: translateX(-50%); }
      .main-layout { grid-template-columns: 1fr; gap: 8px; }
      .column, .meter-panel { min-height: auto; }
      .meter-panel { order: -1; }
      .player-box { min-height: 130px; padding: 10px; }
      .action-box { min-height: 145px; padding: 8px; }
      h1 { font-size: 28px; }
      .subtitle { font-size: 13px; }
      .scoreboard { font-size: 13px; gap: 5px; }
      .score-pill { padding: 5px 9px; }
      .player-title { font-size: 18px; }
      .card { width: 54px; height: 74px; font-size: 28px; }
      .cards { min-height: 82px; }
      .message { font-size: 17px; min-height: 52px; }
      button { font-size: 17px; padding: 13px 8px; }
      .meter-wrap { height: 220px; transform: scale(0.9); margin-top: -8px; margin-bottom: -10px; }
      .meter-panel h2 { font-size: 17px; }
      .stats-box, .wish-box { font-size: 13px; }
      .rules { font-size: 12px; }
    }

    body.mobile-mode .game { width: 100%; padding: 10px; border-radius: 16px; }
    body.mobile-mode .main-layout { grid-template-columns: 1fr; gap: 8px; }
    body.mobile-mode .meter-panel { order: -1; min-height: auto; }
    body.mobile-mode .column { min-height: auto; }
    body.mobile-mode .player-box { min-height: 130px; padding: 10px; }
    body.mobile-mode .action-box { min-height: 145px; padding: 8px; }
    body.mobile-mode h1 { font-size: 28px; }
    body.mobile-mode .subtitle { font-size: 13px; }
    body.mobile-mode .card { width: 54px; height: 74px; font-size: 28px; }
    body.mobile-mode .message { font-size: 17px; }
    body.mobile-mode button { font-size: 17px; padding: 13px 8px; }
    body.mobile-mode .meter-wrap { height: 220px; transform: scale(0.9); margin-top: -8px; margin-bottom: -10px; }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div class="language-toggle">
        <button id="enBtn" onclick="setLanguage('en')">English</button>
        <button id="heBtn" onclick="setLanguage('he')">עברית</button>
      </div>
      <h1 id="title">Me Too Ten</h1>
      <div class="subtitle" id="subtitle">A card game for kids vs. the computer — get as close as possible to 10 without going over</div>
    </header>

    <section class="scoreboard">
      <div class="score-pill"><span id="childWinsLabel">Child Wins</span>: <span id="childWins">0</span></div>
      <div class="score-pill"><span id="computerWinsLabel">Computer Wins</span>: <span id="computerWins">0</span></div>
      <div class="score-pill"><span id="tiesLabel">Ties</span>: <span id="ties">0</span></div>
    </section>

    <section class="main-layout">
      <div class="column">
        <div class="player-box">
          <div class="player-title"><span id="computerName">Computer 🤖</span><span class="sum"><span class="totalLabel">Total</span>: <span id="computerSum">?</span></span></div>
          <div id="computerCards" class="cards"></div>
        </div>
      </div>

      <div class="column">
        <div class="player-box">
          <div class="player-title"><span id="playerName">Player 👦</span><span class="sum"><span class="totalLabel">Total</span>: <span id="childSum">0</span></span></div>
          <div id="childCards" class="cards"></div>
        </div>

        <div class="action-box">
          <div class="message" id="message"></div>
          <section class="controls">
            <button class="hit" id="hitBtn" onclick="childHit()" disabled></button>
            <button class="stand" id="standBtn" onclick="childStand()" disabled></button>
            <button class="new" id="newBtn" onclick="newGame()"></button>
          </section>
        </div>
      </div>

      <aside class="meter-panel">
        <h2 id="tankTitle">Ten Tank</h2>
        <div class="meter-sum"><span id="playerHasLabel">Player Has</span>: <span id="tenFrameSum">0</span></div>
        <div class="meter-wrap">
          <div class="overflow-zone"><div id="overflowFill" class="overflow-fill"></div></div>
          <div class="ten-tank"><div id="tenFill" class="ten-fill"></div></div>
          <div class="ten-line"></div>
          <div class="label10">10</div>
          <div class="label0">0</div>
        </div>
        <div id="overflowBox" class="overflow-box"></div>
        <div id="statsBox" class="stats-box"></div>
        <div id="wishBox" class="wish-box"></div>
      </aside>
    </section>

    <section class="rules" id="rules"></section>
  </main>

  <script>
    const text = {
      en: {
        title: "Me Too Ten",
        subtitle: "A card game for kids vs. the computer — get as close as possible to 10 without going over",
        childWins: "Child Wins",
        computerWins: "Computer Wins",
        ties: "Ties",
        computer: "Computer 🤖",
        player: "Player 👦",
        total: "Total",
        tank: "Ten Tank",
        playerHas: "Player Has",
        hit: "Take Card",
        stand: "Stand",
        newGame: "New Game",
        start: "Press “New Game” to begin.",
        oddsStart: "Odds will appear after taking a card",
        rules: "<strong>Rules:</strong> Each card is a number from 1 to 10. The game ends when both players stop taking cards or when someone goes over 10. The player closest to 10 without going over wins.",
        firstCard: "You got your first card. Check the odds: take another card or stand?",
        nowHave: total => `You now have ${total}. Check the odds: take another card or stand?`,
        playerBust: "The player went over 10. The computer wins 🤖",
        computerTurn: "Now it is the computer's turn...",
        computerBust: total => `The computer went over 10 with ${total}. The player wins! 🎉`,
        playerCloser: (child, computer) => `The player is closer to 10! ${child} vs. ${computer}. Victory! 🎉`,
        computerCloser: (computer, child) => `The computer is closer to 10. ${computer} vs. ${child}. The computer wins 🤖`,
        tie: total => `Both players reached ${total}. Tie! 🤝`,
        overflow: n => `Overflow: ${n} over 10`,
        toTen: n => `${n} to 10`,
        stats: (safe, bust) => `If you take another card:<br>Safe cards: ${safe.length ? safe.join(", ") : "none"}<br>Chance not to bust: ${safe.length * 10}%<br>Chance to bust: ${bust.length * 10}%`,
        wish: wanted => `What card would you like to get now?<br><strong>${wanted}</strong> would get you exactly to 10 🎯`,
        perfect: "Perfect! You reached exactly 10 🎉",
        wentOver: "Oops... you went over 10 🚨"
      },
      he: {
        title: "גם אני עשר",
        subtitle: "משחק קלפים לילד מול המחשב — מתקרבים ל־10 בלי לעבור אותו",
        childWins: "ניצחונות לילד",
        computerWins: "ניצחונות למחשב",
        ties: "תיקו",
        computer: "המחשב 🤖",
        player: "הילד 👦",
        total: "סכום",
        tank: "מיכל עשר",
        playerHas: "לילד יש",
        hit: "עוד קלף",
        stand: "לעצור",
        newGame: "משחק חדש",
        start: "לחץ על “משחק חדש” כדי להתחיל.",
        oddsStart: "הסיכוי יוצג אחרי קבלת קלף",
        rules: "<strong>החוקים:</strong> כל קלף הוא מספר מ־1 עד 10. המשחק מסתיים כששני השחקנים לא רוצים עוד קלפים, או כשמישהו עבר את 10. מנצח מי שהגיע הכי קרוב ל־10 בלי לעבור.",
        firstCard: "קיבלת קלף ראשון. בדוק את הסיכוי בצד: רוצה עוד קלף או לעצור?",
        nowHave: total => `עכשיו יש לך ${total}. בדוק את הסיכוי: רוצה עוד קלף או לעצור?`,
        playerBust: "הילד עבר את 10. המחשב ניצח 🤖",
        computerTurn: "עכשיו תור המחשב...",
        computerBust: total => `המחשב עבר את 10 עם ${total}. הילד ניצח! 🎉`,
        playerCloser: (child, computer) => `הילד קרוב יותר ל־10! ${child} מול ${computer}. ניצחון! 🎉`,
        computerCloser: (computer, child) => `המחשב קרוב יותר ל־10. ${computer} מול ${child}. המחשב ניצח 🤖`,
        tie: total => `שניכם הגעתם ל־${total}. תיקו! 🤝`,
        overflow: n => `חריגה: ${n} מעל 10`,
        toTen: n => `${n} עד 10`,
        stats: (safe, bust) => `אם תיקח עוד קלף:<br>בטוחים: ${safe.length ? safe.join(", ") : "אין"}<br>סיכוי לא לעבור: ${safe.length * 10}%<br>סיכוי לעבור: ${bust.length * 10}%`,
        wish: wanted => `איזה קלף היית רוצה לקבל עכשיו?<br><strong>${wanted}</strong> יביא אותך בדיוק ל־10 🎯`,
        perfect: "מעולה! הגעת בדיוק ל־10 🎉",
        wentOver: "אופס... עברת את 10 🚨"
      }
    };

    let lang = localStorage.getItem("tenGameLanguage") || ((navigator.language || "").startsWith("he") ? "he" : "en");
    let childCards = [], computerCards = [], gameOver = true, computerHidden = true;
    let childWins = Number(localStorage.getItem("tenGameChildWins") || 0);
    let computerWins = Number(localStorage.getItem("tenGameComputerWins") || 0);
    let ties = Number(localStorage.getItem("tenGameTies") || 0);

    const childCardsEl = document.getElementById("childCards");
    const computerCardsEl = document.getElementById("computerCards");
    const childSumEl = document.getElementById("childSum");
    const computerSumEl = document.getElementById("computerSum");
    const messageEl = document.getElementById("message");
    const hitBtn = document.getElementById("hitBtn");
    const standBtn = document.getElementById("standBtn");
    const newBtn = document.getElementById("newBtn");
    const childWinsEl = document.getElementById("childWins");
    const computerWinsEl = document.getElementById("computerWins");
    const tiesEl = document.getElementById("ties");
    const tenFrameSumEl = document.getElementById("tenFrameSum");
    const overflowBoxEl = document.getElementById("overflowBox");
    const statsBoxEl = document.getElementById("statsBox");
    const wishBoxEl = document.getElementById("wishBox");
    const tenFillEl = document.getElementById("tenFill");
    const overflowFillEl = document.getElementById("overflowFill");

    function t() { return text[lang]; }
    function randomCard(){ return Math.floor(Math.random() * 10) + 1; }
    function sum(cards){ return cards.reduce((total, card) => total + card, 0); }

    function setLanguage(newLang) {
      lang = newLang;
      localStorage.setItem("tenGameLanguage", lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
      applyLanguage();
      render();
    }

    function applyLanguage() {
      const copy = t();
      document.title = copy.title;
      document.getElementById("title").textContent = copy.title;
      document.getElementById("subtitle").textContent = copy.subtitle;
      document.getElementById("childWinsLabel").textContent = copy.childWins;
      document.getElementById("computerWinsLabel").textContent = copy.computerWins;
      document.getElementById("tiesLabel").textContent = copy.ties;
      document.getElementById("computerName").textContent = copy.computer;
      document.getElementById("playerName").textContent = copy.player;
      document.querySelectorAll(".totalLabel").forEach(el => el.textContent = copy.total);
      document.getElementById("tankTitle").textContent = copy.tank;
      document.getElementById("playerHasLabel").textContent = copy.playerHas;
      hitBtn.textContent = copy.hit;
      standBtn.textContent = copy.stand;
      newBtn.textContent = copy.newGame;
      document.getElementById("rules").innerHTML = copy.rules;
      document.getElementById("enBtn").classList.toggle("active", lang === "en");
      document.getElementById("heBtn").classList.toggle("active", lang === "he");
      if (gameOver && childCards.length === 0) messageEl.textContent = copy.start;
    }

    function renderCards(container, cards, hidden = false){
      container.innerHTML = "";
      cards.forEach((card, index) => {
        const div = document.createElement("div");
        div.className = "card";
        if (hidden && index > 0) {
          div.classList.add("back");
          div.textContent = "?";
        } else {
          div.textContent = card;
        }
        container.appendChild(div);
      });
    }

    function updateScoreboard(){
      childWinsEl.textContent = childWins;
      computerWinsEl.textContent = computerWins;
      tiesEl.textContent = ties;
      localStorage.setItem("tenGameChildWins", childWins);
      localStorage.setItem("tenGameComputerWins", computerWins);
      localStorage.setItem("tenGameTies", ties);
    }

    function renderMeter(){
      const total = sum(childCards);
      tenFrameSumEl.textContent = total;
      tenFillEl.style.height = `${Math.min(total, 10) * 10}%`;
      overflowFillEl.style.height = `${Math.min(Math.max(total - 10, 0) * 20, 100)}%`;
      overflowBoxEl.textContent = total > 10 ? t().overflow(total - 10) : t().toTen(10 - total);
    }

    function renderStats(){
      const total = sum(childCards);
      if (gameOver || childCards.length === 0) {
        statsBoxEl.textContent = t().oddsStart;
        wishBoxEl.textContent = lang === "he" ? "איזה קלף היית רוצה לקבל עכשיו?" : "What card would you like to get now?";
        return;
      }

      const safe = [], bust = [];
      for (let card = 1; card <= 10; card++) {
        if (total + card <= 10) safe.push(card);
        else bust.push(card);
      }
      statsBoxEl.innerHTML = t().stats(safe, bust);

      if (total < 10) wishBoxEl.innerHTML = t().wish(10 - total);
      else if (total === 10) wishBoxEl.innerHTML = t().perfect;
      else wishBoxEl.innerHTML = t().wentOver;
    }

    function render(){
      renderCards(childCardsEl, childCards, false);
      renderCards(computerCardsEl, computerCards, computerHidden && !gameOver);
      childSumEl.textContent = sum(childCards);
      computerSumEl.textContent = (computerHidden && !gameOver) ? "?" : sum(computerCards);
      hitBtn.disabled = gameOver;
      standBtn.disabled = gameOver;
      updateScoreboard();
      renderMeter();
      renderStats();
    }

    function newGame(){
      childCards = [randomCard()];
      computerCards = [randomCard()];
      gameOver = false;
      computerHidden = true;
      messageEl.textContent = t().firstCard;
      render();
    }

    function childHit(){
      if (gameOver) return;
      childCards.push(randomCard());
      const total = sum(childCards);
      if (total > 10) {
        computerHidden = false;
        endGame(t().playerBust, "computer");
        return;
      }
      messageEl.textContent = t().nowHave(total);
      render();
    }

    function childStand(){
      if (gameOver) return;
      computerHidden = false;
      messageEl.textContent = t().computerTurn;
      render();
      setTimeout(computerPlay, 700);
    }

    function computerPlay(){
      const computerTotal = sum(computerCards);
      const childTotal = sum(childCards);
      const safe = [];
      for (let card = 1; card <= 10; card++) {
        if (computerTotal + card <= 10) safe.push(card);
      }
      const safeChance = safe.length / 10;
      const shouldTake = (computerTotal <= 6 && safeChance >= 0.5) || (computerTotal < childTotal && safeChance >= 0.3);

      if (shouldTake) {
        computerCards.push(randomCard());
        render();
        if (sum(computerCards) > 10) setTimeout(decideWinner, 600);
        else setTimeout(computerPlay, 700);
      } else {
        setTimeout(decideWinner, 600);
      }
    }

    function decideWinner(){
      const childTotal = sum(childCards);
      const computerTotal = sum(computerCards);
      if (computerTotal > 10) {
        endGame(t().computerBust(computerTotal), "child");
        return;
      }
      if (childTotal > computerTotal) endGame(t().playerCloser(childTotal, computerTotal), "child");
      else if (computerTotal > childTotal) endGame(t().computerCloser(computerTotal, childTotal), "computer");
      else endGame(t().tie(childTotal), "tie");
    }

    function endGame(message, result){
      gameOver = true;
      computerHidden = false;
      if (result === "child") childWins++;
      else if (result === "computer") computerWins++;
      else if (result === "tie") ties++;
      messageEl.textContent = message;
      render();
    }

    function detectDeviceMode() {
      const isMobile = window.innerWidth <= 820 || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      document.body.classList.toggle("mobile-mode", isMobile);
    }

    window.addEventListener("resize", detectDeviceMode);
    window.addEventListener("orientationchange", detectDeviceMode);

    detectDeviceMode();
    applyLanguage();
    updateScoreboard();
    render();
  </script>
</body>
</html>
