<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> מד מרחק מעשר </title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Rubik", sans-serif;
      background: linear-gradient(90deg,#a8f0c3,#f8fff9,#a8f0c3);
      color: #063b1d;
      overflow: hidden;
    }

    .app {
      width: min(1380px, 98vw);
      height: 96vh;
      margin: 2vh auto;
      background: rgba(255,255,255,.92);
      border-radius: 28px;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 1fr 250px;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,.12);
    }

    .top {
      grid-column: 1 / 3;
      display: grid;
      grid-template-columns: 1.2fr 1.2fr .8fr .8fr .8fr;
      gap: 14px;
      align-items: center;
    }

    .pill, .goal, .hint {
      background: #f5fbf7;
      border: 2px solid #d8f3e0;
      border-radius: 18px;
      padding: 13px 18px;
      text-align: center;
      font-size: clamp(18px, 1.8vw, 26px);
      font-weight: 800;
    }

    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #7a390f;
    }

    .hint .icon, .goal .icon { font-size: 40px; }

    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      min-height: 0;
    }

    .panel {
      position: relative;
      background: linear-gradient(135deg,#ffffff,#effcf5);
      border: 2px solid #a8edbd;
      border-radius: 24px;
      padding: 22px;
      display: grid;
      grid-template-columns: 1fr 170px;
      align-items: center;
      min-height: 260px;
    }

    .title {
      position: absolute;
      top: 22px;
      right: 28px;
      font-size: clamp(26px, 2.3vw, 38px);
      font-weight: 900;
    }

    .badge {
      position: absolute;
      top: 24px;
      left: 28px;
      background: #dff8e8;
      border-radius: 16px;
      padding: 12px 24px;
      font-size: clamp(20px, 2vw, 30px);
      font-weight: 900;
    }

    .card {
      width: 150px;
      height: 210px;
      border: 6px solid #079845;
      border-radius: 22px;
      background: white;
      margin: 50px auto 0;
      display: grid;
      place-items: center;
      font-size: 76px;
      font-weight: 900;
      color: #087032;
      box-shadow: 0 14px 28px rgba(0,0,0,.16);
      position: relative;
    }

    .card::before {
      content: "♦";
      position: absolute;
      top: 12px;
      left: 18px;
      color: #ff3045;
      font-size: 24px;
    }

    .card::after {
      content: "♦";
      position: absolute;
      bottom: 12px;
      right: 18px;
      color: #ff3045;
      font-size: 24px;
    }

    .prob {
      background: #dff8e8;
      border-radius: 18px;
      padding: 18px 12px;
      text-align: center;
      font-weight: 900;
      font-size: 22px;
      color: #09642e;
      line-height: 1.35;
    }

    .prob strong {
      display: block;
      font-size: 48px;
      margin: 8px 0;
    }

    .ask {
      background: linear-gradient(135deg,#fffdfa,#fff4c9);
      border: 3px solid #f3a000;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      color: #7a390f;
      display: grid;
      place-items: center;
      gap: 8px;
      min-height: 170px;
    }

    .ask h2 {
      margin: 0;
      font-size: clamp(26px, 2.4vw, 40px);
    }

    select {
      width: min(360px, 85%);
      font-size: 28px;
      font-weight: 900;
      padding: 14px;
      border-radius: 14px;
      border: 3px solid #08a24d;
      text-align: center;
      background: white;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding: 14px;
      background: rgba(255,255,255,.75);
      border: 2px solid #e4e4e4;
      border-radius: 22px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 18px 10px;
      font-size: clamp(20px, 2vw, 30px);
      font-weight: 900;
      color: white;
      cursor: pointer;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.18);
    }

    .draw { background: #2563eb; }
    .stop { background: #f97316; }
    .new { background: #16a34a; }

    .meterBox {
      grid-column: 2;
      grid-row: 2 / 4;
      border: 4px solid #079845;
      border-radius: 24px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
      gap: 12px;
      font-size: 24px;
      font-weight: 900;
    }

    .tubeWrap {
      display: grid;
      grid-template-columns: 40px 90px;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .tube {
      width: 70px;
      height: 360px;
      border: 7px solid #076b36;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      background: repeating-linear-gradient(to top,#fff 0 36px,#dcecff 38px 40px);
    }

    .fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(#21cf62,#12a84d);
      transition: height .4s;
    }

    .line10 {
      position: absolute;
      bottom: calc(100% - 7px);
      left: -18px;
      width: 106px;
      height: 8px;
      background: #111827;
      border-radius: 8px;
    }

    .labels {
      height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      color: #0f172a;
    }

    .message {
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      color: #7a390f;
      min-height: 28px;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { height: auto; grid-template-columns: 1fr; }
      .top, .meterBox { grid-column: 1; }
      .meterBox { grid-row: auto; }
      .boards { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="top">
      <div class="hint"><span class="icon">💡</span><span>בחר את המספר<br>שהיית רוצה לקבל</span></div>
      <div class="goal"><span class="icon">🎯</span> המטרה:<br>להגיע ל־10 בדיוק!</div>
      <div class="pill">תיקו: <span id="ties">0</span> 🎯</div>
      <div class="pill">ניצחונות למחשב: <span id="computerWins">0</span> 🏆</div>
      <div class="pill">ניצחונות לילד: <span id="childWins">0</span> 📖</div>
    </section>

    <section class="boards">
      <div class="panel">
        <div class="title">המחשב 🤖</div>
        <div class="badge">סכום: <span id="computerSum">0</span></div>
        <div class="card" id="computerCard">?</div>
        <div></div>
      </div>

      <div class="panel">
        <div class="title">הילד 👦</div>
        <div class="badge">סכום: <span id="childSum">0</span></div>
        <div class="card" id="childCard">?</div>
        <div class="prob">
          הסתברות<br>לקלף הבא:
          <strong id="probability">100%</strong>
          <small id="probText">מספרים 1–10</small>
        </div>
      </div>
    </section>

    <aside class="meterBox">
      <div>מיכל עשר</div>
      <div>לילד יש: <span id="meterSum">0</span></div>
      <div class="tubeWrap">
        <div class="labels"><span>10</span><span>0</span></div>
        <div class="tube">
          <div class="fill" id="fill"></div>
          <div class="line10"></div>
        </div>
      </div>
      <div style="color:red">עד 10</div>
    </aside>

    <section class="ask">
      <h2>🎯 איזה קלף היית רוצה לקבל עכשיו?</h2>
      <div>בחר מספר בין 1 ל־10</div>
      <select id="wish">
        <option value="">בחר מספר...</option>
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
      </select>
      <div class="message" id="message">תור הילד</div>
    </section>

    <section class="actions">
      <button class="draw" onclick="childDraw()">👂 עוד קלף<br><small>אני רוצה קלף נוסף</small></button>
      <button class="stop" onclick="childStop()">✋ לעצור<br><small>זה המספר שבחרתי</small></button>
      <button class="new" onclick="newGame()">✨ משחק חדש<br><small>מתחילים מהתחלה</small></button>
    </section>
  </main>

  <script>
    let childSum = 0;
    let computerSum = 0;
    let childWins = 0;
    let computerWins = 0;
    let ties = 0;
    let gameOver = false;

    const el = id => document.getElementById(id);

    function randomCard() {
      return Math.floor(Math.random() * 10) + 1;
    }

    function updateUI() {
      el("childSum").textContent = childSum;
      el("computerSum").textContent = computerSum;
      el("meterSum").textContent = childSum;

      const height = Math.min(childSum, 10) * 10;
      el("fill").style.height = height + "%";

      const goodCards = Math.max(0, 10 - childSum);
      const probability = Math.round((goodCards / 10) * 100);
      el("probability").textContent = probability + "%";

      if (goodCards <= 0) {
        el("probText").textContent = "כבר הגעת ל־10";
      } else {
        el("probText").textContent = `מספרים 1–${goodCards}`;
      }

      el("childWins").textContent = childWins;
      el("computerWins").textContent = computerWins;
      el("ties").textContent = ties;
    }

    function childDraw() {
      if (gameOver) return;

      const wish = el("wish").value;
      if (!wish) {
        el("message").textContent = "קודם בחר איזה קלף היית רוצה לקבל";
        return;
      }

      const card = randomCard();
      childSum += card;
      el("childCard").textContent = card;

      if (String(card) === wish) {
        el("message").textContent = "יפה! קיבלת בדיוק את הקלף שבחרת";
      } else {
        el("message").textContent = "קיבלת " + card + ". עכשיו תור המחשב";
      }

      el("wish").value = "";
      updateUI();

      if (childSum === 10) {
        endGame("child", "הגעת בדיוק ל־10! ניצחת!");
        return;
      }

      if (childSum > 10) {
        endGame("computer", "עברת את 10. המחשב ניצח.");
        return;
      }

      setTimeout(computerTurn, 700);
    }

    function computerTurn() {
      if (gameOver) return;

      const card = randomCard();
      computerSum += card;
      el("computerCard").textContent = card;

      if (computerSum === 10) {
        updateUI();
        endGame("computer", "המחשב הגיע בדיוק ל־10.");
        return;
      }

      if (computerSum > 10) {
        updateUI();
        endGame("child", "המחשב עבר את 10. הילד ניצח!");
        return;
      }

      el("message").textContent = "תור הילד";
      updateUI();
    }

    function childStop() {
      if (gameOver) return;

      el("message").textContent = "הילד עצר. המחשב משחק...";
      updateUI();

      setTimeout(() => {
        while (computerSum < 7 && computerSum < childSum) {
          const card = randomCard();
          computerSum += card;
          el("computerCard").textContent = card;
        }

        updateUI();
        decideWinner();
      }, 700);
    }

    function decideWinner() {
      const childDistance = Math.abs(10 - childSum);
      const computerDistance = computerSum > 10 ? 99 : Math.abs(10 - computerSum);

      if (childSum > 10) {
        endGame("computer", "הילד עבר את 10. המחשב ניצח.");
      } else if (computerSum > 10) {
        endGame("child", "המחשב עבר את 10. הילד ניצח!");
      } else if (childDistance < computerDistance) {
        endGame("child", "הילד קרוב יותר ל־10. ניצחת!");
      } else if (computerDistance < childDistance) {
        endGame("computer", "המחשב קרוב יותר ל־10.");
      } else {
        endGame("tie", "תיקו! שניכם באותו מרחק מ־10.");
      }
    }

    function endGame(winner, text) {
      gameOver = true;
      el("message").textContent = text;

      if (winner === "child") childWins++;
      if (winner === "computer") computerWins++;
      if (winner === "tie") ties++;

      updateUI();
    }

    function newGame() {
      childSum = 0;
      computerSum = 0;
      gameOver = false;

      el("childCard").textContent = "?";
      el("computerCard").textContent = "?";
      el("wish").value = "";
      el("message").textContent = "תור הילד";

      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
