<script>
  let childSum = 0;
  let computerSum = 0;
  let childWins = 0;
  let computerWins = 0;
  let ties = 0;
  let gameOver = false;

  const el = id => document.getElementById(id);

  function randomCard() {
    return Math.floor(Math.random() * 10) + 1;
  }

  function updateUI() {
    el("childSum").textContent = childSum;
    el("computerSum").textContent = computerSum;
    el("meterSum").textContent = childSum;
    el("fill").style.height = Math.min(childSum, 10) * 10 + "%";

    const safeCards = Math.max(0, 10 - childSum);
    const probability = Math.round((safeCards / 10) * 100);

    el("probability").textContent = probability + "%";
    el("probText").textContent =
      safeCards > 0 ? `מספרים 1–${safeCards}` : "אין קלף בטוח";

    el("childWins").textContent = childWins;
    el("computerWins").textContent = computerWins;
    el("ties").textContent = ties;
  }

  function startRound() {
    gameOver = false;

    childSum = randomCard();
    computerSum = randomCard();

    el("childCard").textContent = childSum;
    el("computerCard").textContent = computerSum;
    el("wish").value = "";

    updateUI();

    if (childSum === 10) return endGame("child", "הילד התחיל עם 10 בדיוק! ניצחת!");
    if (computerSum === 10) return endGame("computer", "המחשב התחיל עם 10 בדיוק. המחשב ניצח.");

    el("message").textContent = "איזה קלף יביא אותך הכי קרוב ל־10?";
  }

  function childDraw() {
    if (gameOver) return;

    const wish = el("wish").value;
    if (!wish) {
      el("message").textContent = "קודם בחר איזה קלף היית רוצה לקבל";
      return;
    }

    const needed = 10 - childSum;

    if (Number(wish) === needed) {
      el("message").textContent =
        "נכון! הקלף הזה יביא אותך בדיוק לעשר. בוא נראה מה הקלף הבא שיצא...";
    } else if (Number(wish) < needed) {
      el("message").textContent =
        "זה קלף בטוח, אבל הוא עדיין לא יביא אותך בדיוק לעשר. בוא נראה מה יצא...";
    } else {
      el("message").textContent =
        "שים לב: אם תקבל את הקלף הזה, תעבור את עשר. בוא נראה מה יצא...";
    }

    setTimeout(() => {
      const card = randomCard();
      childSum += card;
      el("childCard").textContent = card;
      el("wish").value = "";
      updateUI();

      if (childSum === 10) {
        return endGame("child", "הילד הגיע בדיוק ל־10! ניצחת!");
      }

      if (childSum > 10) {
        return endGame("computer", "הילד עבר את 10. המחשב ניצח.");
      }

      el("message").textContent = `יצא לך ${card}. עכשיו תור המחשב.`;

      setTimeout(computerTurn, 800);
    }, 900);
  }

  function computerTurn() {
    if (gameOver) return;

    const card = randomCard();
    computerSum += card;
    el("computerCard").textContent = card;
    updateUI();

    if (computerSum === 10) {
      return endGame("computer", "המחשב הגיע בדיוק ל־10. המחשב ניצח.");
    }

    if (computerSum > 10) {
      return endGame("child", "המחשב עבר את 10. הילד ניצח!");
    }

    el("message").textContent = "תור הילד: איזה קלף היית רוצה לקבל עכשיו?";
  }

  function childStop() {
    if (gameOver) return;

    decideWinner();
  }

  function decideWinner() {
    if (childSum > 10) return endGame("computer", "הילד עבר את 10. המחשב ניצח.");
    if (computerSum > 10) return endGame("child", "המחשב עבר את 10. הילד ניצח!");

    const childDistance = Math.abs(10 - childSum);
    const computerDistance = Math.abs(10 - computerSum);

    if (childDistance < computerDistance) {
      endGame("child", "הילד עצר קרוב יותר ל־10. הילד ניצח!");
    } else if (computerDistance < childDistance) {
      endGame("computer", "המחשב קרוב יותר ל־10. המחשב ניצח.");
    } else {
      endGame("tie", "תיקו! שניכם באותו מרחק מ־10.");
    }
  }

  function endGame(winner, text) {
    gameOver = true;
    el("message").textContent = text;

    if (winner === "child") childWins++;
    if (winner === "computer") computerWins++;
    if (winner === "tie") ties++;

    updateUI();

    setTimeout(() => {
      const startNew = confirm(text + "\n\nרוצה להתחיל משחק חדש?");
      if (startNew) startRound();
    }, 250);
  }

  function newGame() {
    startRound();
  }

  startRound();
</script>
